<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{fragments/layout :: shell('Returns', 'returns', ~{::#content})}">
    <div id="content">
        <div class="row g-3">
            <div class="col-lg-5">
                <div class="card">
                    <div class="card-header">Active / Overdue</div>
                    <div class="card-body p-0">
                        <table class="table table-sm table-hover mb-0 align-middle">
                            <thead><tr><th>Book</th><th>Member</th><th>Due</th><th></th></tr></thead>
                            <tbody>
                            <tr th:each="i : ${activeIssues}" th:classappend="${i.isOverdue} ? 'overdue-row'">
                                <td th:text="${i.book.title}"></td>
                                <td th:text="${i.member.fullName}"></td>
                                <td th:text="${i.dueDate}"></td>
                                <td class="text-end">
                                    <form th:action="@{/circulation/return}" method="post" class="d-inline">
                                        <input type="hidden" name="issueId" th:value="${i.id}">
                                        <button class="btn btn-sm btn-success">Return</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(activeIssues)}"><td colspan="4" class="text-center text-muted py-3">Nothing to return.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-header">Return History</div>
                    <div class="card-body p-0">
                        <table class="table table-sm table-hover mb-0 align-middle">
                            <thead><tr><th>Book</th><th>Member</th><th>Returned</th><th>Due</th><th>Fine</th></tr></thead>
                            <tbody>
                            <tr th:each="i : ${returnedIssues}">
                                <td th:text="${i.book.title}"></td>
                                <td th:text="${i.member.fullName}"></td>
                                <td th:text="${i.returnDate}"></td>
                                <td th:text="${i.dueDate}"></td>
                                <td th:text="${i.fineAmount > 0 ? '$' + i.fineAmount : '-'}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(returnedIssues)}"><td colspan="5" class="text-center text-muted py-3">No returns yet.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
