<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{fragments/layout :: shell('Staff Accounts', 'admin-staff', ~{::#content})}">
    <div id="content">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-shield-lock me-1"></i>Staff Accounts</span>
                <a class="btn btn-sm btn-success" th:href="@{/admin/staff/new}">
                    <i class="bi bi-plus-lg me-1"></i>Create Staff Account
                </a>
            </div>
            <div class="card-body">
                <table class="table table-hover mb-0 align-middle">
                    <thead><tr><th>Username</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
                    <tbody>
                    <tr th:each="u : ${staff}">
                        <td th:text="${u.username}"></td>
                        <td th:text="${u.fullName}"></td>
                        <td th:text="${u.email}"></td>
                        <td><span class="badge badge-soft-primary" th:text="${u.role.label}"></span></td>
                        <td>
                            <span class="badge badge-soft-success" th:if="${u.enabled}">Enabled</span>
                            <span class="badge badge-soft-danger" th:unless="${u.enabled}">Disabled</span>
                        </td>
                        <td class="text-end">
                            <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post"
                                  th:if="${u.role.name() != 'ADMIN'}"
                                  onsubmit="return confirm('Toggle enabled status for this user?');">
                                <button class="btn btn-sm btn-outline-secondary" th:text="${u.enabled} ? 'Disable' : 'Enable'"></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
