<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{fragments/layout :: shell('Publisher Form', 'publishers', ~{::#content})}">
    <div id="content">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">Publisher</div>
                    <div class="card-body">
                        <form th:action="@{/publishers/save}" method="post">
                            <input type="hidden" name="id" th:value="${publisher.id}">
                            <div class="mb-3">
                                <label class="form-label">Name *</label>
                                <input type="text" name="name" class="form-control" th:value="${publisher.name}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <input type="text" name="address" class="form-control" th:value="${publisher.address}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" name="phone" class="form-control" th:value="${publisher.phone}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" th:value="${publisher.email}">
                            </div>
                            <button type="submit" class="btn btn-primary">Save</button>
                            <a class="btn btn-secondary" th:href="@{/publishers}">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
