<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{fragments/layout :: shell('Member Profile', 'members', ~{::#content})}">
    <div id="content">
        <div class="row g-3">
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body text-center">
                        <img th:if="${member.profilePhoto != null}" th:src="${member.profilePhoto}"
                             alt="Profile photo" class="rounded-circle object-fit-cover border" style="width:96px;height:96px;">
                        <i th:unless="${member.profilePhoto != null}" class="bi bi-person-circle text-primary" style="font-size:6rem;"></i>
                        <h4 class="mt-2" th:text="${member.fullName}"></h4>
                        <p class="text-muted mb-1" th:text="${member.membershipNo}"></p>
                        <span class="badge badge-soft-success fs-6" th:if="${member.membershipStatus.name() == 'ACTIVE'}">Active</span>
                        <span class="badge badge-soft-warning fs-6" th:if="${member.membershipStatus.name() == 'INACTIVE'}">Inactive</span>
                        <span class="badge badge-soft-danger fs-6" th:if="${member.membershipStatus.name() == 'SUSPENDED'}">Suspended</span>
                        <hr>
                        <table class="table table-sm text-start mb-0">
                            <tr><th class="text-muted">Email</th><td th:text="${member.email}"></td></tr>
                            <tr><th class="text-muted">Phone</th><td th:text="${member.phone}"></td></tr>
                            <tr><th class="text-muted">Joined</th><td th:text="${member.joinedDate}"></td></tr>
                        </table>
                        <form class="mt-3 d-flex gap-2" th:action="@{/members/{id}/status(id=${member.id})}" method="post">
                            <select name="status" class="form-select form-select-sm">
                                <option value="ACTIVE" th:selected="${member.membershipStatus.name() == 'ACTIVE'}">Active</option>
                                <option value="INACTIVE" th:selected="${member.membershipStatus.name() == 'INACTIVE'}">Inactive</option>
                                <option value="SUSPENDED" th:selected="${member.membershipStatus.name() == 'SUSPENDED'}">Suspended</option>
                            </select>
                            <button class="btn btn-sm btn-outline-primary">Update Status</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card mb-3">
                    <div class="card-header">Borrowing History</div>
                    <div class="card-body p-0">
                        <table class="table table-sm mb-0">
                            <thead><tr><th>Book</th><th>Issued</th><th>Due</th><th>Returned</th><th>Status</th><th>Fine</th></tr></thead>
                            <tbody>
                            <tr th:each="i : ${issues}">
                                <td th:text="${i.book.title}"></td>
                                <td th:text="${i.issueDate}"></td>
                                <td th:text="${i.dueDate}"></td>
                                <td th:text="${i.returnDate != null ? i.returnDate : '-'}"></td>
                                <td>
                                    <span class="badge badge-soft-danger" th:if="${i.status.name() == 'OVERDUE'}">Overdue</span>
                                    <span class="badge badge-soft-warning" th:if="${i.status.name() == 'ISSUED'}">Issued</span>
                                    <span class="badge badge-soft-success" th:if="${i.status.name() == 'RETURNED'}">Returned</span>
                                </td>
                                <td th:text="${i.fineAmount > 0 ? '$' + i.fineAmount : '-'}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(issues)}"><td colspan="6" class="text-center text-muted">No borrowing history.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">Fines</div>
                    <div class="card-body p-0">
                        <table class="table table-sm mb-0">
                            <thead><tr><th>Date</th><th>Book</th><th>Reason</th><th>Amount</th><th>Status</th></tr></thead>
                            <tbody>
                            <tr th:each="f : ${fines}">
                                <td th:text="${f.createdAt.toLocalDate()}"></td>
                                <td th:text="${f.issue != null ? f.issue.book.title : '-'}"></td>
                                <td th:text="${f.reason}"></td>
                                <td th:text="'$' + ${#numbers.formatDecimal(f.amount, 1, 2)}"></td>
                                <td>
                                    <span class="badge badge-soft-warning" th:if="${f.status.name() == 'PENDING'}">Pending</span>
                                    <span class="badge badge-soft-success" th:if="${f.status.name() == 'PAID'}">Paid</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(fines)}"><td colspan="5" class="text-center text-muted">No fines.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
