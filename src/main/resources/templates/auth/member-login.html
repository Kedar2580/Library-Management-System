<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Login | Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <i class="bi bi-person-circle fs-1 text-primary"></i>
            <h1>User Portal</h1>
            <p class="lead">Library user sign in here</p>
            <span class="badge bg-primary">Member</span>
        </div>

        <div class="alert alert-danger" th:if="${param.error}">
            <span>Invalid username or password.</span>
        </div>
        <div class="alert alert-warning" th:if="${roleError != null}" th:text="${roleError}"></div>
        <div class="alert alert-success" th:if="${param.logout}">
            <span>You have been logged out.</span>
        </div>
        <div class="alert alert-success" th:if="${success != null}" th:text="${success}"></div>

        <form th:action="@{/auth/member-login}" method="post">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">User Login</button>
        </form>

        <div class="d-flex justify-content-between mt-3 small">
            <a th:href="@{/auth/forgot-password}">Forgot password?</a>
            <a th:href="@{/auth/register}">Create an account</a>
        </div>
        <div class="text-center mt-3 small">
            <a th:href="@{/auth/login}"><i class="bi bi-arrow-left"></i> Back to portal</a> |
            <a th:href="@{/auth/admin-login}">Staff login</a>
        </div>
    </div>
</div>
</body>
</html>
