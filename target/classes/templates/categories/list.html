<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:replace="~{fragments/layout :: shell('Categories', 'categories', ~{::#content})}">
    <div id="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <div class="lead mb-1">Category Management</div>
                <span class="text-muted" th:text="${#lists.size(categories)} + ' categories'"></span>
            </div>
            <a class="btn btn-primary" th:href="@{/categories/new}"><i class="bi bi-plus-lg me-1"></i>Add Category</a>
        </div>
        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead><tr><th>ID</th><th>Name</th><th>Description</th><th class="text-end">Actions</th></tr></thead>
                    <tbody>
                    <tr th:each="c : ${categories}">
                        <td th:text="${c.id}"></td>
                        <td class="fw-semibold" th:text="${c.name}"></td>
                        <td th:text="${c.description}"></td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-light" th:href="@{/categories/{id}/edit(id=${c.id})}"><i class="bi bi-pencil"></i></a>
                            <form class="d-inline" th:action="@{/categories/{id}/delete(id=${c.id})}" method="post"
                                  onsubmit="return confirm('Delete this category?');">
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(categories)}"><td colspan="4" class="text-center text-muted py-4">No categories.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
