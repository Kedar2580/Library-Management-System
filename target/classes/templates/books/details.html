<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:replace="~{fragments/layout :: shell('Book Details', 'books', ~{::#content})}">
    <div id="content">
        <div class="row g-3">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h4 class="mb-1" th:text="${book.title}">Title</h4>
                                <p class="text-muted mb-1" th:text="'by ' + (${book.author != null ? book.author.name : 'Unknown'})">Author</p>
                                <p class="mb-1">
                                    <span class="badge badge-soft-primary" th:text="${book.category != null ? book.category.name : 'Uncategorized'}"></span>
                                    <span class="badge badge-soft-secondary" th:text="${book.publisher != null ? book.publisher.name : '-'}"></span>
                                    <span class="badge badge-soft-info" th:text="${book.publicationYear}"></span>
                                </p>
                            </div>
                            <span class="badge badge-soft-success fs-6" th:if="${book.available}">Available</span>
                            <span class="badge badge-soft-danger fs-6" th:unless="${book.available}">Out of stock</span>
                        </div>
                        <hr>
                        <table class="table table-sm">
                            <tr><th class="text-muted w-25">ISBN</th><td th:text="${book.isbn != null ? book.isbn : '-'}"></td></tr>
                            <tr><th class="text-muted">Shelf Location</th><td th:text="${book.shelfLocation != null ? book.shelfLocation : '-'}"></td></tr>
                            <tr><th class="text-muted">Total Copies</th><td th:text="${book.totalCopies}"></td></tr>
                            <tr><th class="text-muted">Available Copies</th><td th:text="${book.availableCopies}"></td></tr>
                            <tr><th class="text-muted">Average Rating</th>
                                <td>
                                    <span th:if="${book.reviewCount > 0}">
                                        <span th:each="i : ${#numbers.sequence(1, 5)}">
                                            <i class="bi bi-star-fill" th:classappend="${i > book.avgRating} ? 'empty'"></i>
                                        </span>
                                        <span th:text="'  ' + ${#numbers.formatDecimal(book.avgRating, 1, 1)} + ' (' + ${book.reviewCount} + ' reviews)'"></span>
                                    </span>
                                    <span th:unless="${book.reviewCount > 0}" class="text-muted">No reviews yet</span>
                                </td>
                            </tr>
                            <tr><th class="text-muted">Description</th><td th:text="${book.description != null ? book.description : '-'}"></td></tr>
                        </table>
                        <div class="d-flex gap-2">
                            <a class="btn btn-primary" th:href="@{/circulation/issue(bookId=${book.id})}"><i class="bi bi-box-arrow-right me-1"></i>Issue This Book</a>
                            <a class="btn btn-outline-warning" th:href="@{/circulation/reserve(bookId=${book.id})}" th:unless="${book.available}">Reserve</a>
                            <a class="btn btn-secondary" th:href="@{/books}">Back</a>
                        </div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header">Reviews &amp; Ratings</div>
                    <div class="card-body">
                        <form class="mb-4" th:action="@{/reviews/add}" method="post">
                            <input type="hidden" name="bookId" th:value="${book.id}">
                            <div class="row g-2">
                                <div class="col-md-3">
                                    <select name="rating" class="form-select">
                                        <option value="5">5 - Excellent</option>
                                        <option value="4">4 - Good</option>
                                        <option value="3">3 - Average</option>
                                        <option value="2">2 - Poor</option>
                                        <option value="1">1 - Terrible</option>
                                    </select>
                                </div>
                                <div class="col-md-7">
                                    <input type="text" name="comment" class="form-control" placeholder="Write your review...">
                                </div>
                                <div class="col-md-2">
                                    <button class="btn btn-primary w-100">Submit</button>
                                </div>
                            </div>
                        </form>

                        <div th:each="r : ${reviews}" class="border-bottom py-2">
                            <div class="d-flex justify-content-between">
                                <span class="fw-semibold" th:text="${r.user.fullName}"></span>
                                <span class="small text-muted" th:text="${#temporals.format(r.createdAt, 'MMM dd yyyy')}"></span>
                            </div>
                            <span th:each="i : ${#numbers.sequence(1, 5)}">
                                <i class="bi bi-star-fill text-warning" th:classappend="${i > r.rating} ? 'empty'"></i>
                            </span>
                            <p class="mb-0 text-muted small" th:text="${r.comment}"></p>
                        </div>
                        <p class="text-muted" th:if="${#lists.isEmpty(reviews)}">No reviews yet. Be the first to review!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
