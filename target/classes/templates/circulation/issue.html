<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:replace="~{fragments/layout :: shell('Issue Book', 'issue', ~{::#content})}">
    <div id="content">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-header"><i class="bi bi-box-arrow-right me-1"></i>Issue a Book</div>
                    <div class="card-body">
                        <form th:action="@{/circulation/issue}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Search / Select Member</label>
                                <input class="form-control form-control-lg" list="memberList" id="memberSearch"
                                       placeholder="Type to search member...">
                                <datalist id="memberList">
                                    <option th:each="m : ${members}" th:value="${m.fullName}"
                                            th:attr="data-id=${m.id}"></option>
                                </datalist>
                                <select name="memberId" class="form-select mt-2" required>
                                    <option value="">-- Choose Member --</option>
                                    <option th:each="m : ${members}" th:value="${m.id}"
                                            th:selected="${selectedMember != null and selectedMember == m.id}"
                                            th:text="${m.fullName + ' (' + m.membershipNo + ')'}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Search / Select Book</label>
                                <select name="bookId" class="form-select" required>
                                    <option value="">-- Choose Book --</option>
                                    <option th:each="b : ${availableBooks}" th:value="${b.id}"
                                            th:selected="${selectedBook != null and selectedBook == b.id}"
                                            th:text="${b.title + ' (Available: ' + b.availableCopies + ')'}"></option>
                                </select>
                            </div>
                            <p class="text-muted small mb-3">
                                <i class="bi bi-info-circle me-1"></i>
                                Due date is automatically set based on the loan period in system settings.
                            </p>
                            <button type="submit" class="btn btn-primary">Issue Book</button>
                            <a class="btn btn-secondary" sec:authorize="hasRole('ADMIN') or hasRole('LIBRARIAN')" th:href="@{/issues}">Cancel</a>
                            <a class="btn btn-secondary" sec:authorize="hasRole('MEMBER')" th:href="@{/dashboard}">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <script>
            const memberSearch = document.getElementById('memberSearch');
            if (memberSearch) {
                memberSearch.addEventListener('change', function () {
                    const options = document.querySelectorAll('#memberList option');
                    for (const opt of options) {
                        if (opt.value === this.value) {
                            const id = opt.getAttribute('data-id');
                            document.querySelector('select[name="memberId"]').value = id;
                        }
                    }
                });
            }
        </script>
    </div>
</div>
</body>
</html>
