<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Check Email | Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <i class="bi bi-envelope-check fs-1 text-success"></i>
            <h1>Check Your Email</h1>
            <p class="lead">A password reset link has been generated.</p>
        </div>

        <div class="alert alert-info">
            <strong>Demo mode:</strong> since no email server is configured, your reset link is shown here:
        </div>

        <a class="btn btn-primary w-100 mb-2"
           th:href="@{/auth/reset-password(token=${token})}">
            Click here to reset your password
        </a>

        <div class="text-center mt-2 small text-muted">
            <span th:text="'Token: ' + ${token}"></span>
        </div>
    </div>
</div>
</body>
</html>
