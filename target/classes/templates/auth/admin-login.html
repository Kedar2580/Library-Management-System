<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff Login | Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card auth-card-staff">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock fs-1 text-success"></i>
            <h1>Staff Portal</h1>
            <p class="lead">Library staff sign in here</p>
            <span class="badge bg-success">Administrator / Librarian</span>
        </div>

        <div class="alert alert-danger" th:if="${param.error}">
            <span>Invalid username or password.</span>
        </div>
        <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>
        <div class="alert alert-warning" th:if="${roleError != null}" th:text="${roleError}"></div>
        <div class="alert alert-success" th:if="${param.logout}">
            <span>You have been logged out.</span>
        </div>
        <div class="alert alert-success" th:if="${success != null}" th:text="${success}"></div>

        <form th:action="@{/auth/admin-login}" method="post">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Staff Login</button>
        </form>

        <div class="d-flex justify-content-between mt-3 small">
            <a th:href="@{/auth/forgot-password}">Forgot password?</a>
            <a th:href="@{/auth/member-login}">Not staff? User login</a>
        </div>
        <div class="text-center mt-2 small">
            <a th:href="@{/auth/login}"><i class="bi bi-arrow-left"></i> Back to portal</a>
        </div>

        <hr class="my-4">
        <div class="text-center">
            <button class="btn btn-sm btn-outline-success" data-bs-toggle="collapse" data-bs-target="#createStaffSection">
                <i class="bi bi-person-plus me-1"></i>Create Staff Account
            </button>
        </div>
        <div class="collapse mt-3" th:classappend="${staffFormOpen} ? 'show'" id="createStaffSection">
            <div class="p-3 bg-light rounded">
                <h6 class="text-center mb-3">Create Staff Account</h6>
                <form th:action="@{/auth/admin-register}" method="post">
                    <div class="mb-2">
                        <input type="text" name="username" class="form-control" placeholder="Username" required>
                    </div>
                    <div class="mb-2">
                        <input type="text" name="fullName" class="form-control" placeholder="Full Name" required>
                    </div>
                    <div class="mb-2">
                        <input type="email" name="email" class="form-control" placeholder="Email" required>
                    </div>
                    <div class="mb-2">
                        <input type="text" name="phone" class="form-control" placeholder="Phone">
                    </div>
                    <div class="mb-2">
                        <select name="role" class="form-select">
                            <option value="LIBRARIAN">Librarian</option>
                            <option value="ADMIN">Administrator</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <input type="password" name="password" class="form-control" placeholder="Password" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" name="confirmPassword" class="form-control" placeholder="Confirm Password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Create Staff Account</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
