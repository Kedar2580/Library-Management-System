<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{fragments/layout :: shell('Feedback Inbox', 'admin-feedback', ~{::#content})}">
    <div id="content">
        <div class="card">
            <div class="card-header"><i class="bi bi-inbox me-1"></i>Feedback, Suggestions &amp; Questions</div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead><tr><th>Date</th><th>Name</th><th>Subject</th><th>Type</th><th>Status</th><th class="text-end">Action</th></tr></thead>
                    <tbody>
                    <tr th:each="m : ${messages}">
                        <td th:text="${m.createdAt.toLocalDate()}"></td>
                        <td th:text="${m.name}"><br><small class="text-muted" th:text="${m.email}"></small></td>
                        <td>
                            <span class="fw-semibold" th:text="${m.subject}"></span>
                            <br><small class="text-muted" th:text="${m.content}"></small>
                        </td>
                        <td>
                            <span class="badge badge-soft-info" th:if="${m.type.name() == 'FEEDBACK'}">Feedback</span>
                            <span class="badge badge-soft-primary" th:if="${m.type.name() == 'SUGGESTION'}">Suggestion</span>
                            <span class="badge badge-soft-secondary" th:if="${m.type.name() == 'QUESTION'}">Question</span>
                        </td>
                        <td>
                            <span class="badge badge-soft-danger" th:if="${m.status.name() == 'NEW'}">New</span>
                            <span class="badge badge-soft-warning" th:if="${m.status.name() == 'READ'}">Read</span>
                            <span class="badge badge-soft-success" th:if="${m.status.name() == 'RESOLVED'}">Resolved</span>
                        </td>
                        <td class="text-end">
                            <form th:action="@{/admin/feedback/{id}/status(id=${m.id})}" method="post" class="d-flex gap-1 justify-content-end">
                                <select name="status" class="form-select form-select-sm" style="width:120px">
                                    <option value="NEW" th:selected="${m.status.name() == 'NEW'}">New</option>
                                    <option value="READ" th:selected="${m.status.name() == 'READ'}">Read</option>
                                    <option value="RESOLVED" th:selected="${m.status.name() == 'RESOLVED'}">Resolved</option>
                                </select>
                                <button class="btn btn-sm btn-outline-primary">Update</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(messages)}">
                        <td colspan="6" class="text-center text-muted py-4">No messages yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
